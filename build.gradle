plugins {
    id "architectury-plugin" version "3.4-SNAPSHOT"
    id "dev.architectury.loom" version "1.6-SNAPSHOT" apply false
    // cursegradle は environment タグ (Client/Server) に非対応のため CurseForgeGradle へ移行
    id "net.darkhax.curseforgegradle" version "1.3.33" apply false
    id "com.modrinth.minotaur" version "2.+"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "com.modrinth.minotaur"
    apply plugin: "net.darkhax.curseforgegradle"

    loom {
        silentMojangMappingsLicense()
    }

    repositories {
        maven { url "https://maven.shedaniel.me/" }
        maven { url "https://maven.pitan76.net/" }
        maven { url "https://maven.neoforged.net/releases" }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"

        modApi "net.pitan76:mcpitanlib-common${rootProject.mcpitanlib_version}"
        modApi "net.pitan76:smallstairs-common:1.2.2-SNAPSHOT"
    }

    if (name in "fabric,forge,neoforge".split(",")) {
        var modLoader = name

        if (System.getenv("CURSEFORGE_TOKEN") != null) {
            tasks.register('publishCurseForge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
                apiToken = System.getenv("CURSEFORGE_TOKEN")

                def mainFile = upload('945609', tasks.remapJar)
                mainFile.changelog = rootProject.changelog + "\nMCPitanLib version: " + mcpitanlib_version.split(":")[1]
                mainFile.releaseType = 'release'

                // 2026-07-15 以降、CurseForge は environment タグの指定を必須としている。
                // 未指定だと Error Code 1021 で拒否される。
                mainFile.addEnvironment('Client', 'Server')

                if (modLoader == "fabric") {
                    mainFile.addModLoader('Fabric')
                }
                if (modLoader == "forge") {
                    mainFile.addModLoader('Forge')
                }
                if (modLoader == "neoforge") {
                    mainFile.addModLoader('NeoForge')
                    mainFile.addGameVersion('1.20.3')
                    mainFile.addGameVersion('1.20.4')
                } else {
                    mainFile.addGameVersion('1.18.1')
                    mainFile.addGameVersion('1.18.2')
                    mainFile.addGameVersion('1.19')
                    mainFile.addGameVersion('1.19.1')
                    mainFile.addGameVersion('1.19.2')
                    mainFile.addGameVersion('1.20')
                    mainFile.addGameVersion('1.20.1')
                    mainFile.addGameVersion('1.20.3')
                    mainFile.addGameVersion('1.20.4')
                }

                if (modLoader != "forge") {
                    mainFile.addGameVersion('1.21')
                    mainFile.addGameVersion('1.21.1')
                    mainFile.addGameVersion('1.21.2')
                    mainFile.addGameVersion('1.21.3')
                    mainFile.addGameVersion('1.21.4')
                    mainFile.addGameVersion('1.21.5')
                    mainFile.addGameVersion('1.21.6')
                    mainFile.addGameVersion('1.21.7')
                    mainFile.addGameVersion('1.21.8')
                    mainFile.addGameVersion('1.21.9')
                    mainFile.addGameVersion('1.21.10')
                    mainFile.addGameVersion('1.21.11')
                }

                if (modLoader == "fabric") {
                    mainFile.addGameVersion('26.1')
                    mainFile.addGameVersion('26.1.1')
                    mainFile.addRequirement('fabric-api')
                }

                mainFile.addRequirement('mcpitanlibarch')
                mainFile.addRequirement('small-stairs119')
            }
        }

        if (System.getenv("MODRINTH_TOKEN") != null) {
            modrinth {
                token = System.getenv("MODRINTH_TOKEN")
                projectId = 'additional-small-stairs'
                versionNumber = project.mod_version + "-" + modLoader
                gameVersions = ['1.18', '1.18.1', '1.18.2', '1.19', '1.19.1', '1.19.2', '1.20', '1.20.1', '1.20.3', '1.20.4']
                if (modLoader == "neoForge") {
                    gameVersions = ['1.20.3', '1.20.4']
                }

                if (modLoader != "forge") {
                    gameVersions.addAll(['1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8', '1.21.9', '1.21.10', '1.21.11'])
                }

                if (modLoader == "fabric") {
                    gameVersions.addAll(['26.1', '26.1.1'])
                }

                versionType = 'release'
                uploadFile = tasks.remapJar
                changelog = rootProject.changelog + "\nMCPitanLib version: " + mcpitanlib_version.split(":")[1]
                loaders = [modLoader]
                dependencies {
                    if (modLoader == "fabric") {
                        required.project "P7dR8mSH" // Fabric API
                    }
                    required.project "uNRoUnGT" // mcpitanlib
                    required.project "small-stairs119" // Small Stairs
                }
            }
        }
    }

}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    archivesBaseName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        if (project.name == "neoforge") {
            options.release = 17
            sourceCompatibility = JavaVersion.VERSION_17
            targetCompatibility = JavaVersion.VERSION_17
        } else {
            options.release = 8
            sourceCompatibility = JavaVersion.VERSION_1_8
            targetCompatibility = JavaVersion.VERSION_1_8
        }
    }

    java {
        withSourcesJar()
    }
}

task releaseMods {
    dependsOn("fabric:modrinth")
    dependsOn("forge:modrinth")
    dependsOn("neoforge:modrinth")
}