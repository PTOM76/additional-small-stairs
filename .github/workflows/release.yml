name: Release

on:
  push:
    tags:
      - "v*"

env:
  # ModParks のプロジェクトスラッグ (https://modparks.pitan76.net/projects/<slug>)
  PROJECT_SLUG: additional-small-stairs
  MODPARKS_URL: https://modparks.pitan76.net

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # このリポジトリには gradlew が含まれていないため、Gradle 本体を明示的に用意する
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.6"

      - name: Build
        run: gradle build --no-daemon

      # remapJar の成果物 (dev / sources を除いたもの) を集める
      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p dist
          for loader in fabric forge neoforge; do
            jar=$(ls "$loader"/build/libs/*.jar \
              | grep -v -- '-dev\.jar$' \
              | grep -v -- '-dev-shadow\.jar$' \
              | grep -v -- '-sources\.jar$' \
              | head -n 1)
            if [ -z "$jar" ]; then
              echo "::error::No release jar found for $loader"
              exit 1
            fi
            cp "$jar" dist/
            echo "$loader: $(basename "$jar")"
          done
          ls -1 dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.jar
          generate_release_notes: true

      - name: Register to ModParks
        env:
          MODPARKS_API_KEY: ${{ secrets.MODPARKS_API_KEY }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # ローダーごとの対応 MC バージョン (build.gradle の gameVersions と揃える)
          MC_COMMON="1.18,1.18.1,1.18.2,1.19,1.19.1,1.19.2,1.20,1.20.1,1.20.3,1.20.4"
          MC_1_21="1.21,1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8,1.21.9,1.21.10,1.21.11"

          register() {
            loader="$1"
            mc_versions="$2"

            file_name=$(basename "$(ls dist/*-"$loader"-*.jar | head -n 1)")
            file_url="https://github.com/${REPO}/releases/download/${TAG}/${file_name}"

            echo "Registering ${loader}: ${file_url}"

            # ModParks はバージョン番号の重複を許さないため、ローダー名を付与して分離する
            http_code=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
              -X POST "${MODPARKS_URL}/api/v1/projects/${PROJECT_SLUG}/versions" \
              -H "Authorization: Bearer ${MODPARKS_API_KEY}" \
              -F "versionNumber=${TAG}-${loader}" \
              -F "mcVersions=${mc_versions}" \
              -F "loaders=${loader}" \
              -F "changelog=${CHANGELOG}" \
              -F "fileName=${file_name}" \
              -F "fileUrl=${file_url}")

            cat /tmp/resp.json
            echo
            if [ "$http_code" -ge 300 ]; then
              echo "::error::ModParks registration failed for ${loader} (HTTP ${http_code})"
              return 1
            fi
          }

          CHANGELOG=$(gh release view "$TAG" --json body -q .body || echo "")
          export CHANGELOG

          register fabric   "${MC_COMMON},${MC_1_21},26.1,26.1.1"
          register forge    "${MC_COMMON}"
          register neoforge "1.20.3,1.20.4,${MC_1_21}"
